<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f9f2e8"><meta name="description" content="慢慢記：你的手機股票帳本。記錄交易、股息與換匯，看懂自己的投資成果。">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://api.tiingo.com https://*.workers.dev; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>慢慢記 · 我的投資帳本</title><link rel="stylesheet" href="ui.css"><link rel="icon" href="mark.svg" type="image/svg+xml"><link rel="manifest" href="manifest.json">
</head>
<body>
  <a class="skip" href="#workspace">跳到內容</a>
  <div class="shell">
    <header class="masthead"><a class="brand" href="#entry"><span class="brand-mark" aria-hidden="true">記</span><span>慢慢記<small>我的投資帳本</small></span></a><button id="settings-button" class="quiet" type="button">設定與備份</button></header>
    <div class="scope"><label for="account">這本帳記在<select id="account"><option value="main">我的帳戶</option></select></label><button id="merge" class="pill" type="button" aria-pressed="false">合併看</button><span id="scope-label">資料只存在這台裝置</span></div>
    <main id="workspace" tabindex="-1"></main>
    <nav class="dock" aria-label="主要功能"><a href="#entry" data-page="entry"><span aria-hidden="true">＋</span>記帳</a><a href="#stocks" data-page="stocks"><span aria-hidden="true">▤</span>我的股票</a><a href="#results" data-page="results"><span aria-hidden="true">↗</span>成果</a><a href="#assets" data-page="assets"><span aria-hidden="true">◔</span>資產</a></nav>
    <footer class="footnote">只為自己，留下一筆清楚的紀錄。</footer>
  </div>
  <dialog id="sheet"><div class="sheet-head"><h2 id="sheet-title"></h2><button type="button" id="close-sheet" class="quiet" aria-label="關閉">關閉</button></div><div id="sheet-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <noscript>請啟用 JavaScript 才能使用單機記帳功能。</noscript><script type="module" src="main.js"></script>
</body></html>
