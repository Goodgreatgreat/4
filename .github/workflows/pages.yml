name: 更新官方台股行情並發布
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 17:17 and 19:17 Asia/Taipei, weekdays. The later run retries late official data. GitHub may delay scheduled jobs.
    - cron: '17 9,11 * * 1-5'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: slow-stock-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 下載官方日收盤與ETF分類
        run: npm run quotes
        env:
          REQUIRE_ALL_MARKETS: '1'
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: 發布
        id: deployment
        uses: actions/deploy-pages@v4
